<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corner Bites — Staff POS</title>
<style>
  body{background:#0a0a0a;color:#eee;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .box{background:#171717;border:1px solid #333;border-radius:12px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.6);text-align:center}
  .box h1{color:#84cc16;margin:0 0 6px;font-size:22px}
  .box p.sub{color:#999;margin:0 0 18px;font-size:13px}
  button{width:100%;margin-top:10px;padding:14px;border-radius:8px;border:none;background:#84cc16;color:#0a0a0a;font-weight:800;font-size:16px;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  #msg{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;text-align:left}
  #msg.err{background:#3a0f0f;color:#ffb4b4;border:1px solid #7a2a2a}
  #msg.ok{background:#0f2a0f;color:#b4ffb4;border:1px solid #2a7a2a}
  small{display:block;margin-top:14px;color:#777;font-size:11px}
  a{color:#84cc16}
</style>
</head>
<body>
<div class="box">
  <h1>Corner Bites POS</h1>
  <p class="sub">Tap to start your shift</p>
  <div id="msg"></div>
  <button id="btn" onclick="startShift()">Start Shift</button>
  <small><a href="/admin/">Admin login</a></small>
</div>
<script>
function showMsg(t, ok){
  var m=document.getElementById('msg');
  m.textContent=t; m.className = ok ? 'ok' : 'err'; m.style.display='block';
}
function startShift(){
  var btn=document.getElementById('btn');
  btn.disabled=true; btn.textContent='Starting...'; showMsg('Signing in...', true);
  fetch('/api/auth', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'data='+encodeURIComponent(JSON.stringify({username:'staff', password:'1562206543da764123c21bd524674f0a8aaf49c8a89744c97352fe677f7e4006', getsessiontokens:true})),
    credentials:'same-origin'
  }).then(function(r){ return r.json(); }).then(function(j){
    if(j.error==='OK' && j.data){
      try{
        var authData=j.data; authData.auth_hash='1562206543da764123c21bd524674f0a8aaf49c8a89744c97352fe677f7e4006';
        var ex={}; try{ ex=JSON.parse(localStorage.getItem('wpos_auth')||'{}'); }catch(e){}
        ex['staff']=authData; localStorage.setItem('wpos_auth', JSON.stringify(ex));
        localStorage.setItem('wpos_currentuser', JSON.stringify(authData));
        localStorage.setItem('wpos_devuuid','483d76551020146d79c50ab68334a3680c84456090812738b252bedbcfb7e5ad');
      }catch(e){}
      showMsg('Welcome — opening POS...', true);
      setTimeout(function(){ location.href='/'; }, 500);
    } else {
      showMsg((j && j.error) || 'Could not sign in. Contact admin.');
      btn.disabled=false; btn.textContent='Start Shift';
    }
  }).catch(function(e){
    showMsg('Network error: '+(e.message||e));
    btn.disabled=false; btn.textContent='Start Shift';
  });
}
</script>
</body>
</html>
